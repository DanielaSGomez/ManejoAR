<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Señalización Vial</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --border:#2a2f3a;
    --text:#eef0f3; --muted:#9aa3b2; --accent:#3ea6ff; --good:#37c977; --bad:#ff5d5d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px;}
  .wrap{max-width:860px;margin:0 auto;}
  h1{font-size:21px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{flex:1;min-width:90px;padding:9px 6px;text-align:center;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:12.5px;color:var(--muted);}
  .tab.active{background:var(--accent);color:#04121f;font-weight:700;border-color:var(--accent);}
  .rule{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:16px;}
  .rule b{color:var(--text);}
  .subhead{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:18px 0 8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .sign{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;font-size:11px;color:var(--muted);}
  .shape{width:44px;height:44px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;position:relative;}
  .circle{border-radius:50%;background:#fff;border:4px solid #d81e2c;width:100%;height:100%;}
  .circle-blue{border-radius:50%;background:#2b3a8f;border:4px solid #d81e2c;width:100%;height:100%;}
  .circle-solid{border-radius:50%;background:#d81e2c;width:100%;height:100%;position:relative;}
  .circle-solid::after{content:'';position:absolute;top:47%;left:15%;width:70%;height:14%;background:#fff;}
  .circle-slash{border-radius:50%;background:#2b3a8f;border:4px solid #d81e2c;width:100%;height:100%;position:relative;overflow:hidden;}
  .circle-slash::after{content:'';position:absolute;top:48%;left:-10%;width:120%;height:12%;background:#d81e2c;transform:rotate(-35deg);}
  .octagon{width:100%;height:100%;background:#d81e2c;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:flex;align-items:center;justify-content:center;}
  .octagon span{color:#fff;font-size:9px;font-weight:800;}
  .tri{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:38px solid #d81e2c;margin:0 auto;position:relative;}
  .tri::after{content:'';position:absolute;top:-32px;left:-15px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:26px solid #fff;}
  .diamond{width:32px;height:32px;background:#ffd400;border:3px solid #1a1a1a;transform:rotate(45deg);margin:6px auto 12px;}
  .diamond-o{width:32px;height:32px;background:#ff8c1a;border:3px solid #1a1a1a;transform:rotate(45deg);margin:6px auto 12px;}
  .rect{width:100%;height:100%;border-radius:5px;}
  .rect-blue{background:#2b3a8f;}
  .rect-green{background:#1a8a4a;}
  .rect-purple{background:#4a2b8f;}
  .rect-orange{background:#ff8c1a;border-radius:2px;}
  #quizPane{display:none;}
  .qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;}
  .qtext{font-size:16px;margin-bottom:18px;line-height:1.4;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt{padding:12px;border-radius:10px;background:var(--card2);border:1px solid var(--border);cursor:pointer;font-size:14px;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:rgba(55,201,119,.18);border-color:var(--good);color:var(--good);}
  .opt.wrong{background:rgba(255,93,93,.18);border-color:var(--bad);color:var(--bad);}
  .opt.disabled{pointer-events:none;}
  .score{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted);}
  .score b{color:var(--text);}
  .nextBtn{margin-top:16px;background:var(--accent);color:#04121f;border:none;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;display:none;}
</style>
</head>

function shapeHTML(s){
  if(s==="octagon") return '<div class="shape"><div class="octagon"><span>PARE</span></div></div>';
  if(s==="tri") return '<div class="shape"><div class="tri"></div></div>';
  if(s==="circle-solid") return '<div class="shape"><div class="circle-solid"></div></div>';
  if(s==="circle-slash") return '<div class="shape"><div class="circle-slash"></div></div>';
  if(s==="circle-blue") return '<div class="shape"><div class="circle-blue"></div></div>';
  if(s==="circle") return '<div class="shape"><div class="circle"></div></div>';
  if(s==="diamond") return '<div class="diamond"></div>';
  if(s==="diamond-o") return '<div class="diamond-o"></div>';
  if(s.startsWith("rect")) return `<div class="shape"><div class="rect ${s}"></div></div>`;
  return '';
}

const tabsEl = document.getElementById('tabs');
const tablePane = document.getElementById('tablePane');
const keys = Object.keys(categories);
let activeCat = keys[0];

keys.forEach(k=>{
  const t = document.createElement('div');
  t.className = 'tab' + (k===activeCat?' active':'');
  t.textContent = categories[k].title;
  t.onclick = () => { activeCat = k; renderTable(); switchToTable(); };
  tabsEl.appendChild(t);
});
const quizTab = document.createElement('div');
quizTab.className = 'tab';
quizTab.textContent = '🎯 Quiz';
quizTab.onclick = () => switchToQuiz();
tabsEl.appendChild(quizTab);

function setActiveTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function renderTable(){
  const cat = categories[activeCat];
  let html = `<div class="rule">${cat.rule}</div>`;
  Object.keys(cat.groups).forEach(g=>{
    if(g) html += `<div class="subhead">${g}</div>`;
    html += '<div class="grid">';
    cat.groups[g].forEach(item=>{
      html += `<div class="sign">${shapeHTML(item.s)}${item.l}</div>`;
    });
    html += '</div>';
  });
  tablePane.innerHTML = html;
}

function switchToTable(){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', i < keys.length && keys[i]===activeCat);
  });
  tablePane.style.display='block';
  document.getElementById('quizPane').style.display='none';
}
function switchToQuiz(){
  setActiveTab(quizTab);
  tablePane.style.display='none';
  document.getElementById('quizPane').style.display='block';
  if(order.length===0) startQuiz();
}

renderTable();

let order = [], idx = 0, score = 0, answered = false;
const qTextEl = document.getElementById('qText');
const qOptsEl = document.getElementById('qOpts');
const qNumEl = document.getElementById('qNum');
const qTotalEl = document.getElementById('qTotal');
const qScoreEl = document.getElementById('qScore');
const nextBtn = document.getElementById('nextBtn');
qTotalEl.textContent = questions.length;

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function startQuiz(){
  order = shuffle([...Array(questions.length).keys()]);
  idx = 0; score = 0;
  qScoreEl.textContent = 0;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  nextBtn.style.display = 'none';
  const item = questions[order[idx]];
  qNumEl.textContent = idx+1;
  qTextEl.textContent = item.q;
  qOptsEl.innerHTML = '';
  shuffle(item.opts).forEach(opt=>{
    const d = document.createElement('div');
    d.className = 'opt';
    d.textContent = opt;
    d.onclick = () => selectAnswer(d, opt, item.a);
    qOptsEl.appendChild(d);
  });
}
function selectAnswer(el, chosen, correct){
  if(answered) return;
  answered = true;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  if(chosen === correct){ el.classList.add('correct'); score++; }
  else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(o=>{ if(o.textContent===correct) o.classList.add('correct'); });
  }
  qScoreEl.textContent = score;
  nextBtn.style.display = 'inline-block';
}
nextBtn.onclick = () => {
  idx++;
  if(idx >= order.length){
    qTextEl.textContent = `¡Terminaste! Resultado: ${score}/${questions.length}`;
    qOptsEl.innerHTML = '';
    nextBtn.textContent = 'Volver a empezar';
    nextBtn.onclick = startQuiz;
  } else renderQuestion();
};
</script>
</body>
</html>
