<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ManejAR - Repaso de Curso Vial</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --border:#2a2f3a;
    --text:#eef0f3; --muted:#9aa3b2; --accent:#3ea6ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    padding:24px;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .wrap{max-width:480px;width:100%;}
  h1{font-size:24px;margin:0 0 4px;text-align:center;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px;text-align:center;}
  .card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:var(--text);
    transition:.15s;}
  .card:hover{border-color:var(--accent);background:var(--card2);}
  .icon{font-size:26px;width:44px;text-align:center;flex-shrink:0;}
  .info{flex:1;}
  .title{font-size:15.5px;font-weight:700;margin-bottom:2px;}
  .desc{font-size:12.5px;color:var(--muted);}
  .arrow{color:var(--muted);font-size:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚗  ManejAR</h1>
  <div class="sub">Elegí un tema para repasar</div>

  <a class="card" href="velocidades.html">
    <div class="icon">🏁</div>
    <div class="info">
      <div class="title">Velocidades máximas y mínimas</div>
      <div class="desc">Tabla completa + quiz de zona urbana, rural y autopistas</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="card" href="senalizacion.html">
    <div class="icon">🚦</div>
    <div class="info">
      <div class="title">Señalización vial</div>
      <div class="desc">Reglamentarias, preventivas, informativas, transitorias y horizontal</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="card" href="estacionamiento.html">
    <div class="icon">🅿️</div>
    <div class="info">
      <div class="title">Simulador de estacionamiento</div>
      <div class="desc">Practicá estacionar en paralelo y en 90°</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>
</body>
</html>
